<svg xmlns="http://www.w3.org/2000/svg" width="820" height="250" viewBox="0 0 820 250">
<style>
  :root { --border:#4C1D95; --fg:#E0E7FF; --muted:#A5B4FC; --accent:#F472B6; }
  text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .card { fill: url(#bg); stroke: var(--border); }
  .title { font-size: 17px; font-weight: 700; fill: url(#titleGrad); }
  .label { font-size: 14px; fill: var(--fg); }
  .value { font-size: 14px; font-weight: 700; fill: var(--accent); }
  .muted { font-size: 13px; fill: var(--muted); }
  .dot { fill: var(--accent); }
  .divider { stroke: var(--border); }
  .fade { opacity: 0; animation: fade .6s ease-out forwards; }
  .grow { transform-origin: 430px 0; animation: grow 1s ease-out forwards; transform: scaleX(0); }
  @keyframes fade { to { opacity: 1; } }
  @keyframes grow { to { transform: scaleX(1); } }
</style>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F0C29"/><stop offset="1" stop-color="#2A1B4E"/></linearGradient>
  <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FBCFE8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
</defs>
<rect class="card" x="0.5" y="0.5" width="819" height="249" rx="12"/>
<text x="28" y="40" class="title">GitHub Stats</text>
<text x="430" y="40" class="title">Most Used Languages</text>
<line x1="400" y1="28" x2="400" y2="222" class="divider"/>
<g class="fade" style="animation-delay:0.10s"><circle cx="34" cy="83" r="4" class="dot"/><text x="48" y="88" class="label">Contributions (last year)</text><text x="370" y="88" class="value" text-anchor="end">174</text></g><g class="fade" style="animation-delay:0.18s"><circle cx="34" cy="121" r="4" class="dot"/><text x="48" y="126" class="label">Commits (last year)</text><text x="370" y="126" class="value" text-anchor="end">157</text></g><g class="fade" style="animation-delay:0.26s"><circle cx="34" cy="159" r="4" class="dot"/><text x="48" y="164" class="label">Public repositories</text><text x="370" y="164" class="value" text-anchor="end">21</text></g><g class="fade" style="animation-delay:0.34s"><circle cx="34" cy="197" r="4" class="dot"/><text x="48" y="202" class="label">Languages used</text><text x="370" y="202" class="value" text-anchor="end">12</text></g>
<clipPath id="bar"><rect x="430" y="72" width="360" height="10" rx="5"/></clipPath>
<g clip-path="url(#bar)"><g class="grow"><rect x="430.00" y="72" width="126.73" height="10" fill="#F472B6"/><rect x="556.73" y="72" width="103.86" height="10" fill="#A78BFA"/><rect x="660.58" y="72" width="77.20" height="10" fill="#7DD3FC"/><rect x="737.79" y="72" width="33.63" height="10" fill="#FBCFE8"/><rect x="771.42" y="72" width="9.82" height="10" fill="#C084FC"/><rect x="781.24" y="72" width="7.19" height="10" fill="#38BDF8"/></g></g>
<g class="fade" style="animation-delay:0.40s"><circle cx="435" cy="112" r="5" fill="#F472B6"/><text x="446" y="116" class="label">HTML</text><text x="605" y="116" class="muted" text-anchor="end">35.2%</text></g><g class="fade" style="animation-delay:0.48s"><circle cx="620" cy="112" r="5" fill="#A78BFA"/><text x="631" y="116" class="label">Python</text><text x="790" y="116" class="muted" text-anchor="end">28.8%</text></g><g class="fade" style="animation-delay:0.56s"><circle cx="435" cy="140" r="5" fill="#7DD3FC"/><text x="446" y="144" class="label">JavaScript</text><text x="605" y="144" class="muted" text-anchor="end">21.4%</text></g><g class="fade" style="animation-delay:0.64s"><circle cx="620" cy="140" r="5" fill="#FBCFE8"/><text x="631" y="144" class="label">TypeScript</text><text x="790" y="144" class="muted" text-anchor="end">9.3%</text></g><g class="fade" style="animation-delay:0.72s"><circle cx="435" cy="168" r="5" fill="#C084FC"/><text x="446" y="172" class="label">CSS</text><text x="605" y="172" class="muted" text-anchor="end">2.7%</text></g><g class="fade" style="animation-delay:0.80s"><circle cx="620" cy="168" r="5" fill="#38BDF8"/><text x="631" y="172" class="label">C#</text><text x="790" y="172" class="muted" text-anchor="end">2.0%</text></g>
</svg>
